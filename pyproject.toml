[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manta-analysis"
version = "0.1.0"
description = "Marine Animal Nocturnal Tracking and Analysis"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "opencv-python>=4.8",
  "pandas>=2.0",
  "astral",
]

[tool.setuptools.packages.find]
where = ["src"]
